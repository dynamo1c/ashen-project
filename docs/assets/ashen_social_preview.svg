<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      .bg { fill: #13151A; }
      .grid-line { stroke: #1C1E24; stroke-width: 1; }
      .border-box { fill: #0F1114; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .panel-bg { fill: #1C1E24; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .card-bg { fill: #24272E; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      
      .font-title { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 34px; fill: #C8CDD6; letter-spacing: 0.08em; }
      .font-subtitle { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 11px; fill: #6B7280; letter-spacing: 0.12em; }
      .font-body { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #9CA3AF; }
      .font-mono-label { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #4B5261; letter-spacing: 0.08em; }
      .font-mono-val { font-family: 'Courier New', Courier, monospace; font-size: 15px; fill: #C8CDD6; font-weight: 700; }
      .font-card-title { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #C8CDD6; font-weight: 700; }
      
      .badge-danger { fill: rgba(198,74,74,0.18); stroke: #C64A4A; stroke-width: 1; }
      .badge-text-danger { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #C64A4A; font-weight: 700; }
      .badge-warning { fill: rgba(184,134,42,0.18); stroke: #B8862A; stroke-width: 1; }
      .badge-text-warning { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #B8862A; font-weight: 700; }
      .badge-safe { fill: rgba(58,140,92,0.18); stroke: #3A8C5C; stroke-width: 1; }
      .badge-text-safe { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #3A8C5C; font-weight: 700; }
      
      .node-link { stroke: rgba(255,255,255,0.15); stroke-width: 1.5; stroke-dasharray: 4,4; }
      .node-link-solid { stroke: rgba(198,74,74,0.5); stroke-width: 1.5; }
      .node-circ { fill: #24272E; stroke: #6B7280; stroke-width: 1.5; }
      .node-circ-danger { fill: #24272E; stroke: #C64A4A; stroke-width: 2; }
      .node-circ-warn { fill: #24272E; stroke: #B8862A; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect class="bg" width="1280" height="640"/>

  <!-- Tactical Grid Lines -->
  <line x1="0" y1="50" x2="1280" y2="50" class="grid-line"/>
  <line x1="0" y1="585" x2="1280" y2="585" class="grid-line"/>

  <!-- TOP BAR TELEMETRY -->
  <rect x="30" y="12" width="1220" height="30" class="border-box" rx="3"/>
  <text x="45" y="31" class="font-mono-label">SYS // ASHEN_PROTOCOL_KSP_DATATHON_2026</text>
  <text x="860" y="31" class="font-mono-label">KARNATAKA STATE POLICE · SUBMISSION</text>
  <circle cx="1235" cy="27" r="4" fill="#3A8C5C"/>

  <!-- LEFT PANEL: Tactical Co-Offending Network Graph -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="260" height="518" class="panel-bg" rx="4"/>
    <text x="15" y="30" class="font-mono-label">TACTICAL CO-OFFENDING GRAPH</text>

    <!-- Radar Scope -->
    <g transform="translate(130, 210)">
      <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      
      <line x1="0" y1="-105" x2="0" y2="105" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="-105" y1="0" x2="105" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Network Connections -->
      <line x1="-35" y1="-35" x2="45" y2="-15" class="node-link-solid"/>
      <line x1="45" y1="-15" x2="15" y2="50" class="node-link"/>
      <line x1="-35" y1="-35" x2="15" y2="50" class="node-link-solid"/>
      <line x1="45" y1="-15" x2="65" y2="-45" class="node-link"/>

      <!-- Nodes -->
      <circle cx="-35" cy="-35" r="13" class="node-circ-danger"/>
      <text x="-35" y="-31" font-family="Courier New, monospace" font-size="9" fill="#C64A4A" text-anchor="middle" font-weight="700">N1</text>

      <circle cx="45" cy="-15" r="11" class="node-circ-warn"/>
      <text x="45" y="-11" font-family="Courier New, monospace" font-size="9" fill="#B8862A" text-anchor="middle" font-weight="700">N2</text>

      <circle cx="15" cy="50" r="10" class="node-circ"/>
      <text x="15" y="54" font-family="Courier New, monospace" font-size="9" fill="#C8CDD6" text-anchor="middle">N3</text>

      <circle cx="65" cy="-45" r="8" class="node-circ"/>

      <!-- Radar Pulse Circle -->
      <circle cx="-35" cy="-35" r="20" fill="none" stroke="rgba(198,74,74,0.4)" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Bottom Card inside Left Panel (Strict x-bounds, NO OVERLAP) -->
    <g transform="translate(15, 435)">
      <rect x="0" y="0" width="230" height="68" class="card-bg" rx="3"/>
      <text x="12" y="24" class="font-mono-label">SYNDICATE TRACE</text>
      <text x="12" y="48" class="font-card-title">Koramangala Zone</text>
      <rect x="155" y="32" width="62" height="20" class="badge-danger" rx="2"/>
      <text x="186" y="46" class="badge-text-danger" text-anchor="middle">LINKED</text>
    </g>
  </g>

  <!-- CENTER PANEL: Branding & Metric Cards -->
  <g transform="translate(305, 55)">
    <!-- Title Block -->
    <text x="0" y="45" class="font-title">⚔️ ASHEN PROTOCOL</text>
    <text x="0" y="72" class="font-subtitle">PALANTIR GOTHAM OPERATIONAL CRIME INTELLIGENCE</text>
    
    <text x="0" y="112" class="font-body">High-density decision-support system built for KSP Datathon 2026.</text>
    <text x="0" y="134" class="font-body">Fusing 75k FIR Records, D3 accomplice networks, and Cerebras AI.</text>

    <!-- Metric Cards Grid (2x2) -->
    <!-- Row 1 -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="305" height="85" class="card-bg" rx="3"/>
      <text x="16" y="28" class="font-mono-label">INCIDENT RECORDS</text>
      <text x="16" y="58" class="font-mono-val">75,000 FIR Logs</text>

      <rect x="320" y="0" width="305" height="85" class="card-bg" rx="3"/>
      <text x="16" y="28" class="font-mono-label" transform="translate(320, 0)">OFFENDER PROFILES</text>
      <text x="16" y="58" class="font-mono-val" transform="translate(320, 0)">100,000 Suspects</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 268)">
      <rect x="0" y="0" width="305" height="85" class="card-bg" rx="3"/>
      <text x="16" y="28" class="font-mono-label">COGNITIVE AI ENGINE</text>
      <text x="16" y="58" class="font-mono-val">Cerebras 120B / Gemini</text>

      <rect x="320" y="0" width="305" height="85" class="card-bg" rx="3"/>
      <text x="16" y="28" class="font-mono-label" transform="translate(320, 0)">CLOUD INFRASTRUCTURE</text>
      <text x="16" y="58" class="font-mono-val" transform="translate(320, 0)">Zoho Catalyst Serverless</text>
    </g>

    <!-- Ideology Footnote Box -->
    <g transform="translate(0, 370)">
      <rect x="0" y="0" width="625" height="42" fill="#0F1114" rx="3" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="26" class="font-mono-label">OPERATIONAL MODEL: HUMAN-IN-THE-LOOP DECISION SUPPORT</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Live District Risk Forecast (Strictly X=945 to 1250) -->
  <g transform="translate(945, 55)">
    <rect x="0" y="0" width="305" height="518" class="panel-bg" rx="4"/>
    <text x="16" y="30" class="font-mono-label">LIVE DISTRICT FORECAST</text>

    <!-- Item 1 -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="273" height="75" class="card-bg" rx="3"/>
      <text x="14" y="26" class="font-card-title">Bengaluru Urban</text>
      <text x="14" y="48" class="font-mono-label">HOTSPOT // Z-SCORE +3.42</text>
      <rect x="190" y="16" width="68" height="22" class="badge-danger" rx="2"/>
      <text x="224" y="31" class="badge-text-danger" text-anchor="middle">CRITICAL</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 138)">
      <rect x="0" y="0" width="273" height="75" class="card-bg" rx="3"/>
      <text x="14" y="26" class="font-card-title">Hubballi-Dharwad</text>
      <text x="14" y="48" class="font-mono-label">ELEVATED // Z-SCORE +1.85</text>
      <rect x="190" y="16" width="68" height="22" class="badge-warning" rx="2"/>
      <text x="224" y="31" class="badge-text-warning" text-anchor="middle">ELEVATED</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 228)">
      <rect x="0" y="0" width="273" height="75" class="card-bg" rx="3"/>
      <text x="14" y="26" class="font-card-title">Mangaluru PS Zone</text>
      <text x="14" y="48" class="font-mono-label">BASELINE // Z-SCORE +0.41</text>
      <rect x="190" y="16" width="68" height="22" class="badge-safe" rx="2"/>
      <text x="224" y="31" class="badge-text-safe" text-anchor="middle">NOMINAL</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(16, 318)">
      <rect x="0" y="0" width="273" height="75" class="card-bg" rx="3"/>
      <text x="14" y="26" class="font-card-title">Belagavi Division</text>
      <text x="14" y="48" class="font-mono-label">BASELINE // Z-SCORE +0.12</text>
      <rect x="190" y="16" width="68" height="22" class="badge-safe" rx="2"/>
      <text x="224" y="31" class="badge-text-safe" text-anchor="middle">NOMINAL</text>
    </g>

    <!-- Forecast Footer -->
    <g transform="translate(16, 410)">
      <rect x="0" y="0" width="273" height="32" fill="#0F1114" rx="2"/>
      <text x="14" y="20" class="font-mono-label">UPDATED: REAL-TIME ZCQL ENGINE</text>
    </g>
  </g>

  <!-- BOTTOM BAR TELEMETRY -->
  <rect x="30" y="592" width="1220" height="32" class="border-box" rx="3"/>
  <text x="45" y="612" class="font-mono-label">MODE: DECISION_SUPPORT_ONLY</text>
  <text x="360" y="612" class="font-mono-label">DATASET: 75,000 FIRs (2023 NCRB BOUNDED DISTRIBUTIONS)</text>
  <text x="880" y="612" class="font-mono-label">PROVENANCE: LIVE / MOCK TRANSPARENCY</text>
</svg>
