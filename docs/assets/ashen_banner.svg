<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <style>
      .bg { fill: #13151A; }
      .grid-line { stroke: #1C1E24; stroke-width: 1; }
      .border-box { fill: #0F1114; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .panel-bg { fill: #1C1E24; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .card-bg { fill: #24272E; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      
      .font-title { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 32px; fill: #C8CDD6; letter-spacing: 0.08em; }
      .font-subtitle { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 10px; fill: #6B7280; letter-spacing: 0.12em; }
      .font-body { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #9CA3AF; }
      .font-mono-label { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #4B5261; letter-spacing: 0.08em; }
      .font-mono-val { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #C8CDD6; font-weight: 700; }
      .font-card-title { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #C8CDD6; font-weight: 700; }
      
      .badge-danger { fill: rgba(198,74,74,0.18); stroke: #C64A4A; stroke-width: 1; }
      .badge-text-danger { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #C64A4A; font-weight: 700; }
      .badge-warning { fill: rgba(184,134,42,0.18); stroke: #B8862A; stroke-width: 1; }
      .badge-text-warning { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #B8862A; font-weight: 700; }
      .badge-safe { fill: rgba(58,140,92,0.18); stroke: #3A8C5C; stroke-width: 1; }
      .badge-text-safe { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #3A8C5C; font-weight: 700; }
      
      .node-link { stroke: rgba(255,255,255,0.15); stroke-width: 1.5; stroke-dasharray: 4,4; }
      .node-link-solid { stroke: rgba(198,74,74,0.5); stroke-width: 1.5; }
      .node-circ { fill: #24272E; stroke: #6B7280; stroke-width: 1.5; }
      .node-circ-danger { fill: #24272E; stroke: #C64A4A; stroke-width: 2; }
      .node-circ-warn { fill: #24272E; stroke: #B8862A; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect class="bg" width="1280" height="360"/>

  <!-- Tactical Grid Lines -->
  <line x1="0" y1="40" x2="1280" y2="40" class="grid-line"/>
  <line x1="0" y1="320" x2="1280" y2="320" class="grid-line"/>

  <!-- TOP BAR TELEMETRY -->
  <rect x="30" y="10" width="1220" height="24" class="border-box" rx="2"/>
  <text x="45" y="26" class="font-mono-label">SYS // ASHEN_PROTOCOL_OPERATIONAL_INTEL</text>
  <text x="860" y="26" class="font-mono-label">KSP DATATHON 2026 · KARNATAKA STATE POLICE</text>
  <circle cx="1235" cy="22" r="3" fill="#3A8C5C"/>

  <!-- LEFT PANEL: Tactical Network Scope -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="220" height="262" class="panel-bg" rx="4"/>
    <text x="12" y="24" class="font-mono-label">CO-OFFENDING GRAPH</text>

    <g transform="translate(110, 140)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <line x1="0" y1="-75" x2="0" y2="75" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="-75" y1="0" x2="75" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <line x1="-25" y1="-25" x2="35" y2="-10" class="node-link-solid"/>
      <line x1="35" y1="-10" x2="10" y2="35" class="node-link"/>
      <line x1="-25" y1="-25" x2="10" y2="35" class="node-link-solid"/>

      <circle cx="-25" cy="-25" r="10" class="node-circ-danger"/>
      <text x="-25" y="-22" font-family="Courier New, monospace" font-size="8" fill="#C64A4A" text-anchor="middle" font-weight="700">N1</text>

      <circle cx="35" cy="-10" r="8" class="node-circ-warn"/>
      <text x="35" y="-7" font-family="Courier New, monospace" font-size="8" fill="#B8862A" text-anchor="middle">N2</text>

      <circle cx="10" cy="35" r="7" class="node-circ"/>
    </g>
  </g>

  <!-- CENTER PANEL: Branding & Metrics -->
  <g transform="translate(265, 48)">
    <text x="0" y="38" class="font-title">⚔️ ASHEN PROTOCOL</text>
    <text x="0" y="58" class="font-subtitle">PALANTIR GOTHAM OPERATIONAL CRIME INTELLIGENCE</text>
    
    <text x="0" y="92" class="font-body">High-density decision-support system built for KSP Datathon 2026.</text>
    <text x="0" y="110" class="font-body">Fusing 75k FIR Records, D3 accomplice networks, and Cerebras AI.</text>

    <!-- Metric Cards Grid (4 horizontal) -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="160" height="68" class="card-bg" rx="3"/>
      <text x="12" y="22" class="font-mono-label">INCIDENT LOGS</text>
      <text x="12" y="48" class="font-mono-val">75,000 FIRs</text>

      <rect x="172" y="0" width="160" height="68" class="card-bg" rx="3"/>
      <text x="184" y="22" class="font-mono-label">OFFENDERS</text>
      <text x="184" y="48" class="font-mono-val">100,000</text>

      <rect x="344" y="0" width="160" height="68" class="card-bg" rx="3"/>
      <text x="356" y="22" class="font-mono-label">AI COPILOT</text>
      <text x="356" y="48" class="font-mono-val">Cerebras 120B</text>

      <rect x="516" y="0" width="160" height="68" class="card-bg" rx="3"/>
      <text x="528" y="22" class="font-mono-label">INFRASTRUCTURE</text>
      <text x="528" y="48" class="font-mono-val">Zoho Catalyst</text>
    </g>

    <!-- Operational Model Bar -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="676" height="32" fill="#0F1114" rx="2" stroke="rgba(255,255,255,0.06)"/>
      <text x="14" y="20" class="font-mono-label">OPERATIONAL MODEL: HUMAN-IN-THE-LOOP DECISION SUPPORT</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Risk Forecast (Strictly X=955 to 1250) -->
  <g transform="translate(955, 48)">
    <rect x="0" y="0" width="295" height="262" class="panel-bg" rx="4"/>
    <text x="14" y="24" class="font-mono-label">LIVE DISTRICT FORECAST</text>

    <!-- Item 1 -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="267" height="60" class="card-bg" rx="3"/>
      <text x="12" y="22" class="font-card-title">Bengaluru Urban</text>
      <text x="12" y="42" class="font-mono-label">HOTSPOT // Z-SCORE +3.42</text>
      <rect x="190" y="14" width="65" height="20" class="badge-danger" rx="2"/>
      <text x="222" y="27" class="badge-text-danger" text-anchor="middle">CRITICAL</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(14, 108)">
      <rect x="0" y="0" width="267" height="60" class="card-bg" rx="3"/>
      <text x="12" y="22" class="font-card-title">Hubballi-Dharwad</text>
      <text x="12" y="42" class="font-mono-label">ELEVATED // Z-SCORE +1.85</text>
      <rect x="190" y="14" width="65" height="20" class="badge-warning" rx="2"/>
      <text x="222" y="27" class="badge-text-warning" text-anchor="middle">ELEVATED</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(14, 178)">
      <rect x="0" y="0" width="267" height="60" class="card-bg" rx="3"/>
      <text x="12" y="22" class="font-card-title">Mangaluru PS Zone</text>
      <text x="12" y="42" class="font-mono-label">BASELINE // Z-SCORE +0.41</text>
      <rect x="190" y="14" width="65" height="20" class="badge-safe" rx="2"/>
      <text x="222" y="27" class="badge-text-safe" text-anchor="middle">NOMINAL</text>
    </g>
  </g>

  <!-- BOTTOM BAR TELEMETRY -->
  <rect x="30" y="325" width="1220" height="24" class="border-box" rx="2"/>
  <text x="45" y="341" class="font-mono-label">MODE: DECISION_SUPPORT_ONLY</text>
  <text x="360" y="341" class="font-mono-label">DATASET: 75,000 FIRs (2023 NCRB BOUNDED DISTRIBUTIONS)</text>
  <text x="880" y="341" class="font-mono-label">PROVENANCE: LIVE / MOCK TRANSPARENCY</text>
</svg>
