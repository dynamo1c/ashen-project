<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap');
      .bg { fill: #13151A; }
      .grid-line { stroke: #1C1E24; stroke-width: 1; }
      .border-box { fill: #0F1114; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .panel-bg { fill: #1C1E24; stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .title-main { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 38px; fill: #C8CDD6; letter-spacing: 0.15em; }
      .sub-title { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 13px; fill: #6B7280; letter-spacing: 0.22em; }
      .tagline { font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; fill: #9CA3AF; }
      .badge-danger { fill: rgba(198,74,74,0.18); stroke: #C64A4A; stroke-width: 1; }
      .badge-text-danger { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #C64A4A; font-weight: 500; }
      .badge-warning { fill: rgba(184,134,42,0.18); stroke: #B8862A; stroke-width: 1; }
      .badge-text-warning { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #B8862A; font-weight: 500; }
      .badge-safe { fill: rgba(58,140,92,0.18); stroke: #3A8C5C; stroke-width: 1; }
      .badge-text-safe { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #3A8C5C; font-weight: 500; }
      .mono-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #4B5261; letter-spacing: 0.1em; }
      .mono-val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; fill: #C8CDD6; font-weight: 500; }
      .node-link { stroke: rgba(255,255,255,0.15); stroke-width: 1.5; stroke-dasharray: 4,4; }
      .node-circ { fill: #24272E; stroke: #6B7280; stroke-width: 1.5; }
      .node-circ-danger { fill: #24272E; stroke: #C64A4A; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect class="bg" width="1280" height="360"/>

  <!-- Subtle Tactical Grid Lines -->
  <line x1="0" y1="40" x2="1280" y2="40" class="grid-line"/>
  <line x1="0" y1="320" x2="1280" y2="320" class="grid-line"/>
  <line x1="200" y1="0" x2="200" y2="360" class="grid-line"/>
  <line x1="1080" y1="0" x2="1080" y2="360" class="grid-line"/>

  <!-- Top Status Bar Chrome -->
  <rect x="30" y="12" width="1220" height="24" class="border-box" rx="2"/>
  <text x="45" y="28" class="mono-label">SYS // ASHEN_PROTOCOL_OPERATIONAL_INTEL</text>
  <text x="960" y="28" class="mono-label">KSP DATATHON 2026 · KARNATAKA STATE POLICE</text>
  <circle cx="1235" cy="24" r="4" fill="#3A8C5C"/>

  <!-- Left Tactical Graphic Element (Radar Pulse & Network Preview) -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="220" height="220" class="panel-bg" rx="4"/>
    <text x="15" y="25" class="mono-label">TACTICAL CO-OFFENDING GRAPH</text>
    
    <!-- Concentric radar rings -->
    <circle cx="110" cy="125" r="75" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="110" cy="125" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="110" y1="50" x2="110" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="35" y1="125" x2="185" y2="125" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Network Graph Nodes -->
    <line x1="75" y1="95" x2="145" y2="105" class="node-link"/>
    <line x1="145" y1="105" x2="125" y2="160" class="node-link"/>
    <line x1="75" y1="95" x2="125" y2="160" class="node-link"/>
    <line x1="145" y1="105" x2="170" y2="85" class="node-link"/>

    <circle cx="75" cy="95" r="9" class="node-circ-danger"/>
    <text x="75" y="98" font-family="IBM Plex Mono" font-size="8" fill="#C64A4A" text-anchor="middle">N1</text>

    <circle cx="145" cy="105" r="7" class="node-circ"/>
    <text x="145" y="108" font-family="IBM Plex Mono" font-size="8" fill="#C8CDD6" text-anchor="middle">N2</text>

    <circle cx="125" cy="160" r="7" class="node-circ"/>
    <text x="125" y="163" font-family="IBM Plex Mono" font-size="8" fill="#C8CDD6" text-anchor="middle">N3</text>

    <circle cx="170" cy="85" r="6" class="node-circ"/>

    <!-- Hotspot Ping -->
    <circle cx="75" cy="95" r="18" fill="none" stroke="rgba(198,74,74,0.4)" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Center Branding & Hero Content -->
  <g transform="translate(320, 85)">
    <!-- Title -->
    <text x="0" y="40" class="title-main">⚔️ ASHEN PROTOCOL</text>
    <text x="2" y="65" class="sub-title">PALANTIR GOTHAM-INSPIRED OPERATIONAL CRIME INTELLIGENCE PLATFORM</text>
    
    <text x="2" y="102" class="tagline">High-density decision-support system built for Karnataka State Police — KSP Datathon 2026.</text>
    <text x="2" y="124" class="tagline">Fusing 75k FIR Records, D3.js accomplice networks, Leaflet GIS, and Cerebras AI Copilot.</text>

    <!-- Key Metrics Panel -->
    <g transform="translate(0, 148)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="140" height="55" class="panel-bg" rx="3"/>
      <text x="12" y="20" class="mono-label">INCIDENT LOGS</text>
      <text x="12" y="42" class="mono-val">75,000 FIRs</text>

      <!-- Metric 2 -->
      <rect x="150" y="0" width="140" height="55" class="panel-bg" rx="3"/>
      <text x="162" y="20" class="mono-label">OFFENDER PROFILES</text>
      <text x="162" y="42" class="mono-val">100,000</text>

      <!-- Metric 3 -->
      <rect x="300" y="0" width="140" height="55" class="panel-bg" rx="3"/>
      <text x="312" y="20" class="mono-label">AI COPILOT</text>
      <text x="312" y="42" class="mono-val">Cerebras 120B</text>

      <!-- Metric 4 -->
      <rect x="450" y="0" width="150" height="55" class="panel-bg" rx="3"/>
      <text x="462" y="20" class="mono-label">CLOUD PLATFORM</text>
      <text x="462" y="42" class="mono-val">Zoho Catalyst</text>
    </g>
  </g>

  <!-- Right Tactical Data Feed Overlay -->
  <g transform="translate(950, 70)">
    <rect x="0" y="0" width="270" height="220" class="panel-bg" rx="4"/>
    <text x="15" y="25" class="mono-label">LIVE DISTRICT FORECAST</text>

    <!-- Row 1 -->
    <g transform="translate(15, 42)">
      <text x="0" y="16" font-family="IBM Plex Sans" font-size="12" fill="#C8CDD6">Bengaluru Urban</text>
      <text x="0" y="28" class="mono-label">CR-HOTSPOT // Z-3.42</text>
      <rect x="175" y="4" width="65" height="20" class="badge-danger" rx="2"/>
      <text x="207" y="18" class="badge-text-danger" text-anchor="middle">CRITICAL</text>
    </g>
    <line x1="15" y1="80" x2="255" y2="80" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Row 2 -->
    <g transform="translate(15, 92)">
      <text x="0" y="16" font-family="IBM Plex Sans" font-size="12" fill="#C8CDD6">Hubballi-Dharwad</text>
      <text x="0" y="28" class="mono-label">MODERATE // Z-1.85</text>
      <rect x="175" y="4" width="65" height="20" class="badge-warning" rx="2"/>
      <text x="207" y="18" class="badge-text-warning" text-anchor="middle">ELEVATED</text>
    </g>
    <line x1="15" y1="130" x2="255" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Row 3 -->
    <g transform="translate(15, 142)">
      <text x="0" y="16" font-family="IBM Plex Sans" font-size="12" fill="#C8CDD6">Mangaluru PS Zone</text>
      <text x="0" y="28" class="mono-label">BASELINE // Z-0.41</text>
      <rect x="175" y="4" width="65" height="20" class="badge-safe" rx="2"/>
      <text x="207" y="18" class="badge-text-safe" text-anchor="middle">NOMINAL</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="30" y="325" width="1220" height="22" fill="#0F1114" rx="2"/>
  <text x="45" y="340" class="mono-label">MODE: DECISION_SUPPORT_ONLY</text>
  <text x="320" y="340" class="mono-label">DATASET: 75,000 FIRs (2023 NCRB BOUNDED DISTRIBUTIONS)</text>
  <text x="880" y="340" class="mono-label">PROVENANCE: LIVE / MOCK TRANSPARENCY ENFORCED</text>
</svg>
